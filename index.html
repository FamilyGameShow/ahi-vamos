<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Túnel Cerati - Artefacto</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05021a;
            font-family: sans-serif;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Pantalla de Intro / Bienvenida */
        #pantalla-intro {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 2, 26, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #pantalla-intro h1 {
            color: #fff;
            font-size: 24px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #ff00ff;
            margin-bottom: 10px;
        }
        #pantalla-intro p {
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 300px;
            line-height: 1.4;
        }
        .btn-inicio {
            background: linear-gradient(45deg, #9400d3, #ff00ff);
            border: 2px solid #00ffff;
            color: #fff;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            cursor: pointer;
        }

        /* Capa de juego y UI */
        #ui-capa {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        h2 { margin: 0; font-size: 15px; letter-spacing: 2px; }
        #pregunta-container {
            background: rgba(5, 2, 26, 0.85);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 12px 20px;
            margin: 10px auto;
            max-width: 85%;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            pointer-events: auto;
        }
        #pregunta-texto { font-size: 13px; color: #fff; font-weight: bold; }

        /* Botones de opciones abajo */
        #botones-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: none;
            justify-content: space-around;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 20;
        }
        .btn-opcion {
            background: rgba(148, 0, 211, 0.5);
            border: 2px solid #ff00ff;
            color: #fff;
            padding: 15px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            width: 45%;
            text-shadow: 0 0 5px #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
            cursor: pointer;
        }

        /* Reproductor de YouTube oculto para el audio de fondo */
        #youtube-audio {
            position: absolute;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- PANTALLA DE INTRODUCCIÓN -->
    <div id="pantalla-intro">
        <h1>BIENVENIDOS AL RITO</h1>
        <p>Fase 1: Artefacto<br>Un viaje al universo sonoro de Gustavo Cerati.</p>
        <button class="btn-opcion btn-inicio" onclick="comenzarJuego()">✨ ENTRAR AL VIAJE</button>
    </div>

    <!-- INTERFAZ DEL JUEGO -->
    <div id="ui-capa">
        <h2 id="epoca-titulo">FASE: SIEMPRE ES HOY</h2>
        <div id="pregunta-container">
            <div id="pregunta-texto">¿A qué álbum solista pertenece el tema "Artefacto"?</div>
        </div>
    </div>

    <div id="botones-container">
        <button class="btn-opcion" onclick="responder(false)">Bocanada (1999)</button>
        <button class="btn-opcion" onclick="responder(true)">Siempre es Hoy (2002)</button>
    </div>
    
    <div id="canvas-container"></div>

    <!-- Reproductor de YouTube embebido para Artefacto -->
    <div id="youtube-audio">
        <iframe id="yt-player" width="100" height="100" src="" frameborder="0" allow="autoplay"></iframe>
    </div>

    <script>
        let juegoIniciado = false;

        function comenzarJuego() {
            juegoIniciado = true;
            document.getElementById('pantalla-intro').style.display = 'none';
            document.getElementById('ui-capa').style.display = 'block';
            document.getElementById('botones-container').style.display = 'flex';
            
            // Carga y reproduce "Artefacto" de fondo mediante YouTube automáticamente al presionar el botón
            const ytPlayer = document.getElementById('yt-player');
            ytPlayer.src = "https://www.youtube.com/embed/zhf8guZ41dY?autoplay=1&loop=1&playlist=zhf8guZ41dY";
        }

        const container = id => document.getElementById(id);
        const canvasContainer = document.getElementById('canvas-container');
        
        // Configuración 3D
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05021a, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        canvasContainer.appendChild(renderer.domElement);

        // Túnel Neón
        const geometry = new THREE.CylinderGeometry(15, 15, 400, 24, 15, true);
        const material = new THREE.MeshBasicMaterial({
            color: 0x9400d3,
            wireframe: true,
            side: THREE.BackSide
        });
        const tunnel = new THREE.Mesh(geometry, material);
        tunnel.rotation.x = Math.PI / 2;
        scene.add(tunnel);

        // Partículas del universo
        const particleCount = 120;
        const particleGeometry = new THREE.BufferGeometry();
        const positions = [];
        for(let i = 0; i < particleCount; i++) {
            positions.push((Math.random() - 0.5) * 35, (Math.random() - 0.5) * 35, (Math.random() - 0.5) * 300);
        }
        particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        const particleMaterial = new THREE.PointsMaterial({color: 0x00ffff, size: 0.9});
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        camera.position.z = 0;

        // Lógica de respuesta
        function responder(esCorrecta) {
            if (esCorrecta) {
                alert("¡Exacto! 'Artefacto' es una joya de Siempre es Hoy. Pasas a la siguiente sala.");
                tunnel.material.color.setHex(0x00ffcc); // Cian brillante
            } else {
                alert("MmM, no. Ese tema es de Siempre es Hoy. ¡Probá de nuevo!");
                tunnel.material.color.setHex(0xff0055); // Rojo error
            }
            setTimeout(() => {
                tunnel.material.color.setHex(0x9400d3);
            }, 1000);
        }

        let targetX = 0;
        let targetY = 0;

        window.addEventListener('mousemove', (e) => {
            if(!juegoIniciado) return;
            targetX = (e.clientX - window.innerWidth / 2) * 0.002;
            targetY = (e.clientY - window.innerHeight / 2) * 0.002;
        });

        window.addEventListener('touchmove', (e) => {
            if(!juegoIniciado) return;
            if(e.touches.length > 0) {
                targetX = (e.touches[0].clientX - window.innerWidth / 2) * 0.002;
                targetY = (e.touches[0].clientY - window.innerHeight / 2) * 0.002;
            }
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);

            tunnel.rotation.z += 0.005;
            particles.position.z += 1.5;
            if(particles.position.z > 150) particles.position.z = 0;

            camera.rotation.y += (targetX - camera.rotation.y) * 0.05;
            camera.rotation.x += (targetY - camera.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
