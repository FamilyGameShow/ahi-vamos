                { p: "¿Diseño de tapa icónico con Gustavo...", a: "Con mariposas / humo estético", b: "En la playa", r: 1 },

            ]},
            { id: "fuerza_natural", nombre: "FUERZA NATURAL (2009)", trackId: "Z7ndVxqUb48", fondo: "https://i.ibb.co/V0yVhy8Y/fuerza-natural.png", conquistado: false, preguntas: [
                { p: "¿Con qué vehículo se identifica conceptualmente la estética?", a: "Una coupé modelo rutero / viaje psicodélico", b: "Una nave espacial de los 70", r: 1 },
                { p: "¿Primer corte difusión con videoclip rutero?", a: "Déjà vu", b: "Fuerza natural", r: 1 },
                { p: "¿Sonoridad general del álbum?", a: "Pop rock terráqueo, folk y psicodelia", b: "Heavy metal sinfónico", r: 1 },
                { p: "¿Último álbum de estudio de su carrera?", a: "Sí", b: "No, grabó otro después", r: 1 },
                { p: "¿Arte de tapa diseñado con concepto de...", a: "Álbum rutero místico y cósmico", b: "Pintura clásica abstracta", r: 1 },
                { p: "¿Canción con gran despliegue melódico y poético?", a: "Magia", b: "Fuerza natural", r: 2 },
                { p: "¿Participó su hijo Benito en la composición?", a: "Sí, en varios temas clave", b: "No participó", r: 1 },
                { p: "¿Ganador de múltiples premios...", a: "Grammy Latinos", b: "Premios Gardel de Oro únicamente", r: 1 },
                { p: "¿El viaje conceptual proponía ir hacia...", a: "Una travesía natural y mental", b: "El espacio exterior galáctico", r: 1 },
                { p: "¿Su legado musical en esta obra es...", a: "Una despedida luminosa y brillante", b: "Un trabajo experimental fallido", r: 1 }
            ]}
        ];

        function cambiarFondo(urlImagen) {
            document.getElementById('escenografia-fondo').style.backgroundImage = `url('${urlImagen}')`;
        }

        document.getElementById('btn-entrar').addEventListener('click', iniciarConteoRegresivo);
        document.getElementById('btn-entrar').addEventListener('touchend', (e) => { e.preventDefault(); iniciarConteoRegresivo(); });

        function iniciarConteoRegresivo() {
            document.getElementById('pantalla-intro').style.display = 'none';
            document.getElementById('pantalla-conteo').style.display = 'flex';
            cambiarFondo("https://i.ibb.co/9Hy8h9fL/colores-santos.png");
            reproducirAudio("Wun6zDSpwkg");

            let cuenta = 3;
            const numEl = document.getElementById('txt-conteo-numero');
            numEl.innerText = cuenta;
            let timer = setInterval(() => {
                cuenta--;
                if (cuenta > 0) {
                    numEl.innerText = cuenta;
                } else {
                    clearInterval(timer);
                    document.getElementById('pantalla-conteo').style.display = 'none';
                    comenzarJuegoReal();
                }
            }, 1000);
        }

        function comenzarJuegoReal() {
            juegoIniciado = true;
            document.getElementById('ui-capa').style.display = 'flex';
            document.getElementById('btn-trofeos').style.display = 'block';
            cargarMultiversoDiscos();
        }

        document.getElementById('btn-volver').addEventListener('click', volverAlMultiverso);
        document.getElementById('btn-volver').addEventListener('touchend', (e) => { e.preventDefault(); volverAlMultiverso(); });

        document.getElementById('btn-trofeos').addEventListener('click', abrirVentanaTrofeos);
        document.getElementById('btn-trofeos').addEventListener('touchend', (e) => { e.preventDefault(); abrirVentanaTrofeos(); });
        document.getElementById('btn-cerrar-trofeos').addEventListener('click', cerrarVentanaTrofeos);
        document.getElementById('btn-cerrar-trofeos').addEventListener('touchend', (e) => { e.preventDefault(); cerrarVentanaTrofeos(); });

        document.getElementById('btn-entrar-disco').addEventListener('click', confirmarEntradaDisco);
        document.getElementById('btn-entrar-disco').addEventListener('touchend', (e) => { e.preventDefault(); confirmarEntradaDisco(); });
        document.getElementById('btn-cancelar-disco').addEventListener('click', cancelarFocoDisco);
        document.getElementById('btn-cancelar-disco').addEventListener('touchend', (e) => { e.preventDefault(); cancelarFocoDisco(); });

        document.getElementById('trivia-btn-1').addEventListener('click', () => verificarRespuestaConsigna(1));
        document.getElementById('trivia-btn-2').addEventListener('click', () => verificarRespuestaConsigna(2));

        // Control de audio fluido para evitar que se reinicie si ya está sonando
        function reproducirAudio(videoId) {
            if (cancionActualId !== videoId) {
                cancionActualId = videoId;
                const ytPlayer = document.getElementById('yt-player');
                ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}`;
            }
        }

        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02000a, 0.012);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        canvasContainer.appendChild(renderer.domElement);

        const starGeometry = new THREE.BufferGeometry();
        const starPositions = [];
        for(let i = 0; i < 800; i++) {
            starPositions.push((Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500, (Math.random() - 0.5) * 1000);
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({color: 0xffffff, size: 0.8}));
        scene.add(stars);
        camera.position.z = 15;

        let raycaster = new THREE.Raycaster();
        let mouseVector = new THREE.Vector2();

        function limpiarEscena() {
            meshesDiscos.forEach(m => scene.remove(m));
            meshesDiscos = [];
        }

        function cargarMultiversoDiscos() {
            limpiarEscena();
            estadoActual = "MENU_PRINCIPAL";
            discoEnFoco = null;
            document.getElementById('btn-volver').style.display = 'none';
            document.getElementById('btn-trofeos').style.display = 'block';
            document.getElementById('disco-seleccionado-banner').style.display = 'none';
            document.getElementById('txt-estado').innerText = "TOCA UN DISCO PARA VERLO";
            cambiarFondo("https://i.ibb.co/9Hy8h9fL/colores-santos.png");
            reproducirAudio("Wun6zDSpwkg");

            const textureLoader = new THREE.TextureLoader();
            const discosDisponibles = listaDiscos.filter(d => !d.conquistado);

            discosDisponibles.forEach((disco, index) => {
                const grupoDisco = new THREE.Group();

                // 1. Tapa del disco (Derecha, mirando siempre al frente con un sutil brillo)
                const geometry = new THREE.PlaneGeometry(4.2, 4.2);
                let material;
                if(disco.fondo) {
                    const texture = textureLoader.load(disco.fondo);
                    material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
                } else {
                    material = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
                }
                const mesh = new THREE.Mesh(geometry, material);
                grupoDisco.add(mesh);

                // 2. Cartel con el Nombre del Disco debajo
                const canvasTexto = document.createElement('canvas');
                canvasTexto.width = 512;
                canvasTexto.height = 128;
                const ctx = canvasTexto.getContext('2d');
                ctx.fillStyle = 'rgba(10, 5, 30, 0.9)';
                ctx.fillRect(0, 0, 512, 128);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 6;
                ctx.strokeRect(0, 0, 512, 128);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 26px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(disco.nombre, 256, 64);

                const textureTexto = new THREE.CanvasTexture(canvasTexto);
                const materialTexto = new THREE.MeshBasicMaterial({ map: textureTexto, transparent: true });
                const geometryTexto = new THREE.PlaneGeometry(4.6, 1.2);
                const meshTexto = new THREE.Mesh(geometryTexto, materialTexto);
                meshTexto.position.y = -2.8;
                grupoDisco.add(meshTexto);

                const posX = (Math.random() - 0.5) * 28;
                const posY = (Math.random() - 0.5) * 15;
                const posZ = -25 - (index * 16);

                grupoDisco.position.set(posX, posY, posZ);
                // Sin rotación lateral: vienen derechos hacia adelante
                grupoDisco.rotation.set(0, 0, 0);
                grupoDisco.userData = { tipo: 'disco', discoData: disco };
                
                scene.add(grupoDisco);
                meshesDiscos.push(grupoDisco);
            });
        }

        function enfocarDisco(discoObj) {
            estadoActual = "DISCO_EN_FOCO";
            discoEnFoco = discoObj.userData.discoData;

            // Detenemos los demás y centramos el seleccionado mirando derecho al frente
            meshesDiscos.forEach(mesh => {
                if (mesh === discoObj) {
                    mesh.position.set(0, 0.5, 2);
                    mesh.rotation.set(0, 0, 0); // Siempre derecho
                    mesh.scale.set(1.6, 1.6, 1.6);
                } else {
                    mesh.visible = false;
                }
            });

            document.getElementById('disco-seleccionado-titulo').innerText = discoEnFoco.nombre;
            document.getElementById('disco-seleccionado-banner').style.display = 'block';
            document.getElementById('txt-estado').innerText = "DISCO SELECCIONADO";
            document.getElementById('btn-trofeos').style.display = 'none';
        }

        function cancelarFocoDisco() {
            cargarMultiversoDiscos();
        }

        function confirmarEntradaDisco() {
            if (!discoEnFoco) return;
            document.getElementById('disco-seleccionado-banner').style.display = 'none';
            entrarADisco(discoEnFoco);
        }

        function entrarADisco(disco) {
            limpiarEscena();
            estadoActual = "JUEGO_DISCO";
            discoActual = disco;
            preguntaActualIndex = 0;
            erroresEnDisco = 0;

            document.getElementById('btn-trofeos').style.display = 'none';
            document.getElementById('btn-volver').style.display = 'block';
            document.getElementById('txt-estado').innerText = disco.nombre;
            if(disco.fondo) cambiarFondo(disco.fondo);
            
            // Aquí reproducimos el tema específico del disco sin cortar bruscamente si ya venía sonando
            reproducirAudio(disco.trackId);

            mostrarSiguienteConsigna();
        }

        function mostrarSiguienteConsigna() {
            if (preguntaActualIndex < discoActual.preguntas.length) {
                const preguntaObj = discoActual.preguntas[preguntaActualIndex];
                document.getElementById('trivia-titulo').innerText = `${discoActual.nombre} (Consigna ${preguntaActualIndex + 1}/10)`;
                document.getElementById('trivia-pregunta').innerText = preguntaObj.p;
                document.getElementById('trivia-btn-1').innerText = preguntaObj.a;
                document.getElementById('trivia-btn-2').innerText = preguntaObj.b;
                document.getElementById('trivia-modal').style.display = 'block';
            } else {
                finalizarDisco();
            }
        }

        function verificarRespuestaConsigna(opcionElegida) {
            const preguntaObj = discoActual.preguntas[preguntaActualIndex];
            document.getElementById('trivia-modal').style.display = 'none';

            if (opcionElegida === preguntaObj.r) {
                puntos += 10;
                document.getElementById('txt-puntos').innerText = puntos;
            } else {
                erroresEnDisco++;
            }

            preguntaActualIndex++;
            mostrarSiguienteConsigna();
        }

        function finalizarDisco() {
            let puntosGanadosDisco = 100 - (erroresEnDisco * 10);
            if (puntosGanadosDisco < 0) puntosGanadosDisco = 0;

            if (!discoActual.conquistado) {
                discoActual.conquistado = true;
                discosConquistadosCount++;
                document.getElementById('txt-discos-conquistados').innerText = discosConquistadosCount;
            }

            alert(`¡Disco conquistado! Obtuviste ${puntosGanadosDisco} puntos en este mundo.`);
            volverAlMultiverso();
        }

        function volverAlMultiverso() {
            document.getElementById('trivia-modal').style.display = 'none';
            document.getElementById('trofeos-modal').style.display = 'none';
            document.getElementById('disco-seleccionado-banner').style.display = 'none';
            cargarMultiversoDiscos();
        }

        function abrirVentanaTrofeos() {
            if (estadoActual !== "MENU_PRINCIPAL") return;
            const grid = document.getElementById('grid-trofeos-lista');
            grid.innerHTML = '';

            listaDiscos.forEach(disco => {
                const div = document.createElement('div');
                div.className = `item-trofeo ${disco.conquistado ? 'conquistado' : ''}`;
                div.innerHTML = `
                    <img src="${disco.fondo}" alt="Tapa">
                    <div>
                        <strong>${disco.nombre}</strong><br>
                        <span>${disco.conquistado ? '✅ Conquistado' : '🔒 Pendiente'}</span>
                    </div>
                `;
                grid.appendChild(div);
            });

            document.getElementById('trofeos-modal').style.display = 'block';
        }

        function cerrarVentanaTrofeos() {
            document.getElementById('trofeos-modal').style.display = 'none';
        }

        function manejarSeleccionToque(clientX, clientY) {
            if (!juegoIniciado || estadoActual !== "MENU_PRINCIPAL") return;

            mouseVector.x = (clientX / window.innerWidth) * 2 - 1;
            mouseVector.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouseVector, camera);
            const intersects = raycaster.intersectObjects(meshesDiscos, true);

            if (intersects.length > 0) {
                let objSeleccionado = intersects[0].object;
                while (objSeleccionado.parent && !objSeleccionado.userData.discoData) {
                    objSeleccionado = objSeleccionado.parent;
                }
                if (objSeleccionado.userData && objSeleccionado.userData.discoData) {
                    enfocarDisco(objSeleccionado);
                }
            }
        }

        window.addEventListener('click', (e) => { manejarSeleccionToque(e.clientX, e.clientY); });
        window.addEventListener('touchend', (e) => {
            if(e.changedTouches.length > 0) {
                manejarSeleccionToque(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);

            if (estadoActual === "MENU_PRINCIPAL") {
                meshesDiscos.forEach(mesh => {
                    mesh.position.z += 0.08;
                    // Vuelo recto y derecho (sin giro lateral de la tapa)
                    if (mesh.position.z > 5) {
                        mesh.position.z = -150;
                        mesh.position.x = (Math.random() - 0.5) * 28;
                        mesh.position.y = (Math.random() - 0.5) * 15;
                    }
                });
            }

            const starArr = stars.geometry.attributes.position.array;
            for(let i = 2; i < starArr.length; i += 3) {
                starArr[i] += 0.5;
                if(starArr[i] > 100) starArr[i] = -900;
            }
            stars.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
