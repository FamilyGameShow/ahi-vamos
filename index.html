<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Túnel Cerati - Los Mundos Inmersivos</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05021a;
            font-family: sans-serif;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Pantalla de Intro / Bienvenida */
        #pantalla-intro {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 2, 26, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #pantalla-intro h1 {
            color: #fff;
            font-size: 24px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #ff00ff;
            margin-bottom: 10px;
        }
        #pantalla-intro p {
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 300px;
            line-height: 1.4;
        }
        .btn-inicio {
            background: linear-gradient(45deg, #ffcc00, #ff00ff);
            border: 2px solid #00ffff;
            color: #fff;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            cursor: pointer;
        }

        /* Capa de juego y UI (Puntaje y Vidas arriba) */
        #ui-capa {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            color: #fff;
            text-shadow: 0 0 10px #00ffff;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        .stats-box {
            font-size: 14px;
            font-weight: bold;
            background: rgba(5, 2, 26, 0.7);
            border: 1px solid #00ffff;
            padding: 5px 12px;
            border-radius: 10px;
        }

        /* Cuadro de Pregunta */
        #pregunta-wrapper {
            position: absolute;
            top: 70px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        #pregunta-container {
            background: rgba(5, 2, 26, 0.85);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 12px 20px;
            margin: 0 auto;
            max-width: 85%;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            pointer-events: auto;
        }
        #epoca-titulo { margin: 0 0 5px 0; font-size: 12px; color: #ff00ff; letter-spacing: 2px; }
        #pregunta-texto { font-size: 13px; color: #fff; font-weight: bold; }

        /* Botones de opciones abajo */
        #botones-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: none;
            justify-content: space-around;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 20;
        }
        .btn-opcion {
            background: rgba(148, 0, 211, 0.5);
            border: 2px solid #ff00ff;
            color: #fff;
            padding: 15px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            width: 45%;
            text-shadow: 0 0 5px #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
            cursor: pointer;
        }

        /* Reproductor de YouTube oculto para el audio de fondo */
        #youtube-audio {
            position: absolute;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- PANTALLA DE INTRODUCCIÓN -->
    <div id="pantalla-intro">
        <h1>BIENVENIDOS AL RITO</h1>
        <p>Atraviesa los portales de los mundos de Gustavo Cerati.</p>
        <button class="btn-opcion btn-inicio" onclick="comenzarJuego()">✨ ENTRAR AL VIAJE</button>
    </div>

    <!-- ESTADÍSTICAS -->
    <div id="ui-capa">
        <div class="stats-box">PUNTOS: <span id="txt-puntos">0</span></div>
        <div class="stats-box">VIDAS: <span id="txt-vidas">❤️❤️❤️</span></div>
    </div>

    <!-- PREGUNTA ACTIVA -->
    <div id="pregunta-wrapper">
        <div id="pregunta-container">
            <div id="epoca-titulo">FASE 1</div>
            <div id="pregunta-texto">Cargando...</div>
        </div>
    </div>

    <!-- BOTONES DE RESPUESTA -->
    <div id="botones-container">
        <button id="btn-1" class="btn-opcion" onclick="responder(1)">Opción A</button>
        <button id="btn-2" class="btn-opcion" onclick="responder(2)">Opción B</button>
    </div>
    
    <div id="canvas-container"></div>

    <!-- Reproductor de YouTube embebido -->
    <div id="youtube-audio">
        <iframe id="yt-player" width="100" height="100" src="" frameborder="0" allow="autoplay"></iframe>
    </div>

    <script>
        let juegoIniciado = false;
        let puntos = 0;
        let vidas = 3;
        let nivelActual = 0;

        // Base de datos de los Mundos / Eras de Cerati
        const trivias = [
            {
                epoca: "MUNDO: AMOR AMARILLO (1993)",
                colorMundo: 0xffcc00, 
                pregunta: "¿Con qué canción arranca su debut solista 'Amor Amarillo'?",
                opcionA: "Amor amarillo",
                opcionB: "Pulsar",
                respuestaCorrecta: 1,
                trackId: "jiKGUnzCAKo"
            },
            {
                epoca: "MUNDO: BOCANADA (1999)",
                colorMundo: 0x0066ff, 
                pregunta: '¿En qué año se lanzó el icónico álbum solista "Bocanada"?',
                opcionA: "1997",
                opcionB: "1999",
                respuestaCorrecta: 2,
                trackId: "eGrx3tZzjwE"
            },
            {
                epoca: "MUNDO: SIEMPRE ES HOY (2002)",
                colorMundo: 0xff0033, 
                pregunta: '¿A qué disco solista pertenece el tema "Artefacto"?',
                opcionA: "Siempre es Hoy",
                opcionB: "Fuerza Natural",
                respuestaCorrecta: 1,
                trackId: "T1tDbvoHzo8"
            },
            {
                epoca: "MUNDO: ¡AHÍ VAMOS! (2006)",
                colorMundo: 0xcccccc, 
                pregunta: '¿Qué instrumento predomina fuertemente en el sonido rock de "¡Ahí Vamos"?',
                opcionA: "Sintetizadores analógicos",
                opcionB: "Guitarras eléctricas crudas",
                respuestaCorrecta: 2,
                trackId: "sZnZfl6OGx8"
            },
            {
                epoca: "MUNDO: FUERZA NATURAL (2009)",
                colorMundo: 0x228b22, 
                pregunta: '¿Cuál es el concepto visual y sonoro del último álbum "Fuerza Natural"?',
                opcionA: "Viaje rutero y psicodelia folk",
                opcionB: "Electrónica de discoteca",
                respuestaCorrecta: 1,
                trackId: "tsTIlhhU_Q0"
            }
        ];

        function comenzarJuego() {
            juegoIniciado = true;
            document.getElementById('pantalla-intro').style.display = 'none';
            document.getElementById('ui-capa').style.display = 'flex';
            document.getElementById('pregunta-wrapper').style.display = 'block';
            document.getElementById('botones-container').style.display = 'flex';
            
            cargarMundoYPregunta(0);
        }

        function actualizarAudio(videoId) {
            const ytPlayer = document.getElementById('yt-player');
            ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}`;
        }

        function cargarMundoYPregunta(index) {
            const t = trivias[index];
            document.getElementById('epoca-titulo').innerText = t.epoca;
            document.getElementById('pregunta-texto').innerText = t.pregunta;
            document.getElementById('btn-1').innerText = t.opcionA;
            document.getElementById('btn-2').innerText = t.opcionB;

            // Cambiar el color de todos los anillos del túnel al color del mundo actual
            anillos.forEach(aro => {
                aro.material.color.setHex(t.colorMundo);
            });

            actualizarAudio(t.trackId);
        }

        // Configuración 3D con Three.js
        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05021a, 0.04);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        canvasContainer.appendChild(renderer.domElement);

        // Sistema de Anillos Concéntricos (Túnel Real de Aros de Neón)
        const cantidadAnillos = 40;
        const anillos = [];
        const radioTunel = 12;

        for (let i = 0; i < cantidadAnillos; i++) {
            const geometriaAro = new THREE.RingGeometry(radioTunel - 0.4, radioTunel, 24);
            const materialAro = new THREE.MeshBasicMaterial({
                color: 0xffcc00,
                side: THREE.DoubleSide,
                wireframe: true
            });
            const aro = new THREE.Mesh(geometriaAro, materialAro);
            
            // Distribuir los aros a lo largo del eje Z (profundidad del túnel)
            aro.position.z = -i * 15;
            scene.add(aro);
            anillos.push(aro);
        }

        camera.position.z = 5;

        // Lógica de respuesta
        function responder(seleccionUsuario) {
            const t = trivias[nivelActual];
            const esCorrecta = (seleccionUsuario === t.respuestaCorrecta);

            if (esCorrecta) {
                puntos += 100;
                document.getElementById('txt-puntos').innerText = puntos;
                
                nivelActual++;
                if(nivelActual < trivias.length) {
                    alert("¡Portal superado! Entrando al siguiente mundo de Cerati...");
                    cargarMundoYPregunta(nivelActual);
                } else {
                    alert("¡Felicitaciones! Completaste todos los mundos y eras de Gustavo con " + puntos + " puntos.");
                    location.reload();
                }
            } else {
                vidas--;
                actualizarVidasUI();
                
                // Destello rojo en los anillos por error
                anillos.forEach(aro => aro.material.color.setHex(0xff0000));
                
                if(vidas <= 0) {
                    alert("Te quedaste sin vidas en el viaje. ¡Inténtalo de nuevo!");
                    location.reload();
                } else {
                    alert("¡Respuesta incorrecta! Pierdes una vida.");
                }

                setTimeout(() => {
                    anillos.forEach(aro => aro.material.color.setHex(t.colorMundo));
                }, 800);
            }
        }

        function actualizarVidasUI() {
            let corazones = "";
            for(let i = 0; i < vidas; i++) corazones += "❤️";
            document.getElementById('txt-vidas').innerText = corazones;
        }

        let targetX = 0;
        let targetY = 0;

        window.addEventListener('mousemove', (e) => {
            if(!juegoIniciado) return;
            targetX = (e.clientX - window.innerWidth / 2) * 0.0015;
            targetY = (e.clientY - window.innerHeight / 2) * 0.0015;
        });

        window.addEventListener('touchmove', (e) => {
            if(!juegoIniciado) return;
            if(e.touches.length > 0) {
                targetX = (e.touches[0].clientX - window.innerWidth / 2) * 0.0015;
                targetY = (e.touches[0].clientY - window.innerHeight / 2) * 0.0015;
            }
        }, { passive: true });

        // Bucle de animación: Los aros se mueven hacia la cámara generando el túnel perfecto
        function animate() {
            requestAnimationFrame(animate);

            // Mover cada anillo hacia adelante para simular velocidad continua
            anillos.forEach(aro => {
                aro.position.z += 1.2; // Velocidad del viaje
                aro.rotation.z += 0.01; // Giro psicodélico del aro

                // Si el anillo pasa al jugador, lo mandamos al fondo del túnel para hacer loop infinito
                if (aro.position.z > 10) {
                    aro.position.z = - (cantidadAnillos - 1) * 15;
                }
            });

            // Movimiento sutil de la cámara con el dedo/mouse
            camera.rotation.y += (targetX - camera.rotation.y) * 0.05;
            camera.rotation.x += (targetY - camera.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
