<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Túnel Cerati - Prototipo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05021a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-capa {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
            pointer-events: none;
        }
        h1 { margin: 0; font-size: 24px; letter-spacing: 3px; }
        p { margin: 5px 0; font-size: 14px; color: #00ffff; }
    </style>
    <!-- Importamos la librería 3D Three.js -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="ui-capa">
        <h1>AVANZANDO EN EL TIEMPO</h1>
        <p>Gira o arrastra para explorar el túnel psicodélico</p>
    </div>
    
    <div id="canvas-container"></div>

    <script>
        // Configuración básica de la escena 3D
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05021a, 0.015); // Niebla para dar profundidad

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Crear la forma del túnel usando un cilindro invertido
        const geometry = new THREE.CylinderGeometry(20, 20, 500, 32, 20, true);
        
        // Material con estilo de malla (wireframe) fosforescente
        const material = new THREE.MeshBasicMaterial({
            color: 0x9400d3,
            wireframe: true,
            side: THREE.BackSide // Para ver el cilindro desde adentro
        });
        
        const tunnel = new THREE.Mesh(geometry, material);
        rotation_speed = 0.002;
        tunnel.rotation.x = Math.PI / 2; // Acostar el cilindro
        scene.add(tunnel);

        // Agregar líneas de neón extras flotando para dar más efecto de velocidad
        const pairs = 40;
        const lineGeometry = new THREE.BufferGeometry();
        const positions = [];
        for(let i=0; i<pairs; i++) {
            positions.push((Math.random()-0.5)*30, (Math.random()-0.5)*30, (Math.random()-0.5)*400);
        }
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        const lineMaterial = new THREE.PointsMaterial({color: 0x00ffff, size: 0.7});
        const stars = new THREE.Points(lineGeometry, lineMaterial);
        scene.add(stars);

        // Posición inicial de la cámara del jugador dentro del túnel
        camera.position.z = 0;

        // Variables para interacción táctil/mouse básica
        let targetX = 0;
        let targetY = 0;

        window.addEventListener('mousemove', (e) => {
            targetX = (e.clientX - window.innerWidth/2) * 0.05;
            targetY = (e.clientY - window.innerHeight/2) * 0.05;
        });

        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                targetX = (e.touches[0].clientX - window.innerWidth/2) * 0.05;
                targetY = (e.touches[0].clientY - window.innerHeight/2) * 0.05;
            }
        });

        // Bucle de animación (se ejecuta 60 veces por segundo)
        function animate() {
            requestAnimationFrame(animate);

            // Efecto de avance infinito moviendo las texturas hacia atrás
            tunnel.rotation.y += rotation_speed;
            stars.position.z += 1.5; 
            if(stars.position.z > 200) stars.position.z = 0; // Reinicia ciclo de partículas

            // Suavizado del movimiento de cámara al interactuar
            camera.rotation.y += (targetX - camera.rotation.y) * 0.05;
            camera.rotation.x += (targetY - camera.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }

        // Ajustar si se gira la pantalla del celular
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
