<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Colores Santos - El Multiverso de Cerati</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #02000a; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* Indicador visual de la punta de la nave (AHORA ES LA MIRA DE IMPACTO) */
        #nave-hud {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 50px solid rgba(0, 255, 255, 0.6);
            filter: drop-shadow(0 0 15px #00ffff);
            /* Importante: desactivamos eventos de puntero para que el dedo guíe por debajo */
            pointer-events: none; 
            z-index: 5;
            transition: transform 0.05s ease-out;
        }

        /* Pantalla de Intro / Bienvenida */
        #pantalla-intro { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(2, 0, 10, 0.96); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px; box-sizing: border-box; }
        #pantalla-intro h1 { color: #fff; font-size: 26px; letter-spacing: 5px; text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff; margin-bottom: 10px; }
        #pantalla-intro p { color: #00ffff; font-size: 14px; margin-bottom: 30px; max-width: 320px; line-height: 1.5; }
        .btn-inicio { background: linear-gradient(45deg, #ff00ff, #00ffff); border: 2px solid #fff; color: #fff; padding: 15px 35px; border-radius: 30px; font-size: 16px; font-weight: bold; letter-spacing: 2px; box-shadow: 0 0 25px rgba(255, 0, 255, 0.7); cursor: pointer; }

        /* Capa de Estadísticas y Estado del Viaje */
        #ui-capa { position: absolute; top: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; color: #fff; text-shadow: 0 0 10px #ff00ff; z-index: 10; pointer-events: none; display: none; }
        .stats-box { font-size: 13px; font-weight: bold; background: rgba(10, 5, 30, 0.8); border: 1px solid #ff00ff; padding: 6px 12px; border-radius: 12px; }
        #btn-volver { position: absolute; top: 60px; left: 20px; background: rgba(255, 0, 255, 0.3); border: 1px solid #ff00ff; color: #fff; padding: 8px 15px; border-radius: 10px; font-size: 12px; cursor: pointer; z-index: 15; display: none; pointer-events: auto; }

        /* Ventana flotante de Trivia al chocar un icono / mundo */
        #trivia-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 5, 30, 0.95); border: 2px solid #00ffff; border-radius: 15px; padding: 20px; width: 85%; max-width: 350px; box-shadow: 0 0 30px rgba(0, 255, 255, 0.6); z-index: 50; text-align: center; display: none; }
        #trivia-titulo { color: #ff00ff; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px; font-weight: bold; }
        #trivia-pregunta { color: #fff; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .btn-opcion-cosmos { background: rgba(0, 255, 255, 0.2); border: 2px solid #00ffff; color: #fff; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: bold; width: 100%; margin-bottom: 10px; cursor: pointer; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3); }

        /* Reproductor de YouTube oculto para el audio de fondo */
        #youtube-audio { position: absolute; top: -9999px; left: -9999px; visibility: hidden; }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- PANTALLA DE INTRODUCCIÓN -->
    <div id="pantalla-intro">
        <h1>VUELTA POR EL UNIVERSO</h1>
        <p>Toma el comando de la nave, atraviesa portales galácticos y conquista cada disco de Soda Stereo y Gustavo Cerati.</p>
        <button class="btn-opcion btn-inicio" onclick="comenzarJuego()">✨ ENTRAR AL COSMOS</button>
    </div>

    <!-- UI DE JUEGO Y ESTADÍSTICAS -->
    <div id="ui-capa">
        <div class="stats-box">PUNTOS: <span id="txt-puntos">0</span></div>
        <div class="stats-box" id="txt-estado">SELECCIONA UNA GALAXIA</div>
        <div class="stats-box">VIDAS: <span id="txt-vidas">❤️❤️❤️</span></div>
    </div>
    <button id="btn-volver" onclick="volverAlNivelAnterior()">⬅️ VOLVER</button>

    <!-- VENTANA DE TRIVIA FLOTANTE -->
    <div id="trivia-modal">

        <div id="trivia-pregunta">Pregunta aquí...</div>
        <button id="trivia-btn-1" class="btn-opcion-cosmos" onclick="verificarRespuesta(1)">Opción A</button>
        <button id="trivia-btn-2" class="btn-opcion-cosmos" onclick="verificarRespuesta(2)">Opción B</button>
    </div>

    <div id="youtube-audio">
