<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Colores Santos - El Multiverso de Cerati</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #02000a;
            font-family: sans-serif;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Pantalla de Intro / Bienvenida */
        #pantalla-intro {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 0, 10, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #pantalla-intro h1 {
            color: #fff;
            font-size: 26px;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
            margin-bottom: 10px;
        }
        #pantalla-intro p {
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 320px;
            line-height: 1.5;
        }
        .btn-inicio {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border: 2px solid #fff;
            color: #fff;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.7);
            cursor: pointer;
        }

        /* Capa de Estadísticas y Estado del Viaje */
        #ui-capa {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            color: #fff;
            text-shadow: 0 0 10px #ff00ff;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        .stats-box {
            font-size: 13px;
            font-weight: bold;
            background: rgba(10, 5, 30, 0.8);
            border: 1px solid #ff00ff;
            padding: 6px 12px;
            border-radius: 12px;
        }
        #btn-volver {
            position: absolute;
            top: 60px;
            left: 20px;
            background: rgba(255, 0, 255, 0.3);
            border: 1px solid #ff00ff;
            color: #fff;
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            z-index: 15;
            display: none;
            pointer-events: auto;
        }

        /* Ventana flotante de Trivia al chocar un mundo */
        #trivia-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 5, 30, 0.95);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 20px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            z-index: 50;
            text-align: center;
            display: none;
        }
        #trivia-titulo { color: #ff00ff; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px; font-weight: bold; }
        #trivia-pregunta { color: #fff; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .btn-opcion-cosmos {
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #00ffff;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        /* Reproductor de YouTube oculto para el audio de fondo */
        #youtube-audio {
            position: absolute;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- PANTALLA DE INTRODUCCIÓN -->
    <div id="pantalla-intro">
        <h1>VUELTA POR EL UNIVERSO</h1>
        <p>Explora el multiverso musical de Soda Stereo y Gustavo Cerati. Choca los portales para elegir tu camino.</p>
        <button class="btn-opcion btn-inicio" onclick="comenzarJuego()">✨ ENTRAR AL COSMOS</button>
    </div>

    <!-- ESTADÍSTICAS Y BOTÓN RETROCEDER -->
    <div id="ui-capa">
        <div class="stats-box">PUNTOS: <span id="txt-puntos">0</span></div>
        <div class="stats-box" id="txt-estado">SELECCIONA UNA GALAXIA</div>
        <div class="stats-box">VIDAS: <span id="txt-vidas">❤️❤️❤️</span></div>
    </div>
    <button id="btn-volver" onclick="volverAlMenuPrincipal()">⬅️ VOLVER A GALAXIAS</button>

    <!-- VENTANA DE TRIVIA FLOTANTE -->
    <div id="trivia-modal">
        <div id="trivia-titulo">MUNDO DISCO</div>
        <div id="trivia-pregunta">Pregunta aquí...</div>
        <button id="trivia-btn-1" class="btn-opcion-cosmos" onclick="verificarRespuesta(1)">Opción A</button>
        <button id="trivia-btn-2" class="btn-opcion-cosmos" onclick="verificarRespuesta(2)">Opción B</button>
    </div>
    
    <div id="canvas-container"></div>

    <!-- Reproductor de YouTube embebido -->
    <div id="youtube-audio">
        <iframe id="yt-player" width="100" height="100" src="" frameborder="0" allow="autoplay"></iframe>
    </div>

    <script>
        let juegoIniciado = false;
        let puntos = 0;
        let vidas = 3;
        let estadoActual = "MENU_PRINCIPAL"; // MENU_PRINCIPAL, MENU_DISCOS, JUEGO_PREGUNTAS
        let objetosCosmos = [];
        let elementoSeleccionado = null;
        let pausarVuelo = false;

        // Estructura Jerárquica del Multiverso
        const multiverso = {
            soda: {
                nombre: "GALAXIA: SODA STEREO",
                trackId: "SV3oyTWdQao",
                color: 0x00ffff,
                discos: [
                    { nombre: "DISCO: CANCIÓN ANIMAL", color: 0x990000, trackId: "eGrx3tZzjwE", preguntas: [
                        { pregunta: "¿En qué año se lanzó el álbum 'Canción Animal'?", opcionA: "1988", opcionB: "1990", respuestaCorrecta: 2 },
                        { pregunta: "¿Qué hit icónico abre el disco 'Canción Animal'?", opcionA: "De Música Ligera", opcionB: "En la Ciudad de la Furia", respuestaCorrecta: 1 }
                    ]},
                    { nombre: "DISCO: DOBLE VIDA", color: 0xffcc00, trackId: "lxWYAUF-mak", preguntas: [
                        { pregunta: "¿Cuál es el primer tema de 'Doble Vida'?", opcionA: "Pic nic en el 4to B", opcionB: "Lo Que Sangra (La Cúpula)", respuestaCorrecta: 1 }
                    ]}
                ]
            },
            solista: {
                nombre: "GALAXIA: GUSTAVO CERATI",
                trackId: "T1tDbvoHzo8",
                color: 0xff00ff,
                discos: [
                    { nombre: "DISCO: BOCANADA", color: 0x0066ff, trackId: "sZnZfl6OGx8", preguntas: [
                        { pregunta: '¿En qué año se lanzó el álbum "Bocanada"?', opcionA: "1997", opcionB: "1999", respuestaCorrecta: 2 },
                        { pregunta: "¿Qué tema famoso pertenece a Bocanada?", opcionA: "Puente", opcionB: "Crimen", respuestaCorrecta: 1 }
                    ]},
                    { nombre: "DISCO: FUERZA NATURAL", color: 0x228b22, trackId: "tsTIlhhU_Q0", preguntas: [
                        { pregunta: "¿Cuál fue el último álbum de estudio solista de Cerati?", opcionA: "Siempre es Hoy", opcionB: "Fuerza Natural", respuestaCorrecta: 2 }
                    ]}
                ]
            }
        };

        function comenzarJuego() {
            juegoIniciado = true;
            document.getElementById('pantalla-intro').style.display = 'none';
            document.getElementById('ui-capa').style.display = 'flex';
            actualizarAudio("jiKGUnzCAKo");
            cargarMenuPrincipal();
        }

        function actualizarAudio(videoId) {
            const ytPlayer = document.getElementById('yt-player');
            ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}`;
        }

        // Configuración 3D con Three.js
        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02000a, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        canvasContainer.appendChild(renderer.domElement);

        // Campo de Estrellas de fondo
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = [];
        for(let i = 0; i < 600; i++) {
            starPositions.push((Math.random() - 0.5) * 300, (Math.random() - 0.5) * 300, (Math.random() - 0.5) * 800);
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({color: 0xffffff, size: 0.8}));
        scene.add(stars);

        camera.position.z = 10;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        function limpiarCosmos() {
            objetosCosmos.forEach(obj => scene.remove(obj));
            objetosCosmos = [];
        }

        // 1. CARGAR MENÚ PRINCIPAL (Galaxias Soda y Solista)
        function cargarMenuPrincipal() {
            limpiarCosmos();
            estadoActual = "MENU_PRINCIPAL";
            document.getElementById('btn-volver').style.display = 'none';
            document.getElementById('txt-estado').innerText = "SELECCIONA UNA GALAXIA";

            const galaxias = [
                { key: 'soda', nombre: multiverso.soda.nombre, color: multiverso.soda.color },
                { key: 'solista', nombre: multiverso.solista.nombre, color: multiverso.solista.color }
            ];

            galaxias.forEach((g, index) => {
                const mesh = crearMundoMesh(g.nombre, g.color, index);
                mesh.userData = { tipo: 'galaxia', key: g.key, ...multiverso[g.key] };
                scene.add(mesh);
                objetosCosmos.push(mesh);
            });
        }

        // 2. CARGAR MENÚ DE DISCOS DE LA GALAXIA SELECCIONADA
        function cargarDiscosGalaxia(galaxiaData) {
            limpiarCosmos();
            estadoActual = "MENU_DISCOS";
            document.getElementById('btn-volver').style.display = 'block';
            document.getElementById('txt-estado').innerText = galaxiaData.nombre;
            actualizarAudio(galaxiaData.trackId);

            galaxiaData.discos.forEach((disco, index) => {
                const mesh = crearMundoMesh(disco.nombre, disco.color, index);
                mesh.userData = { tipo: 'disco', ...disco };
                scene.add(mesh);
                objetosCosmos.push(mesh);
            });
        }

        // 3. CARGAR PREGUNTAS DEL DISCO (Estrellas / Mundos flotantes)
        let discoActualSeleccionado = null;
        function cargarPreguntasDisco(discoData) {
            limpiarCosmos();
            estadoActual = "JUEGO_PREGUNTAS";
            discoActualSeleccionado = discoData;
            document.getElementById('txt-estado').innerText = discoData.nombre;
            actualizarAudio(discoData.trackId);

            discoData.preguntas.forEach((preg, index) => {
                const mesh = crearMundoMesh(`PREGUNTA ${index + 1}`, 0xff00ff, index);
                mesh.userData = { tipo: 'pregunta', ...preg };
                scene.add(mesh);
                objetosCosmos.push(mesh);
            });
        }

        function crearMundoMesh(nombre, colorHex, index) {
            const geometry = new THREE.SphereGeometry(3.5, 24, 24);
            const material = new THREE.MeshBasicMaterial({ color: colorHex, wireframe: true });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 25, -60 - (index * 40));
            return mesh;
        }

        function volverAlMenuPrincipal() {
            cargarMenuPrincipal();
        }

        // Detección de toque / clic en el espacio
        window.addEventListener('pointerdown', (e) => {
            if (!juegoIniciado || pausarVuelo) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objetosCosmos);

            if (intersects.length > 0) {
                const objetoTocado = intersects[0].object;
                const data = objetoTocado.userData;

                if (data.tipo === 'galaxia') {
                    cargarDiscosGalaxia(data);
                } else if (data.tipo === 'disco') {
                    cargarPreguntasDisco(data);
                } else if (data.tipo === 'pregunta') {
                    elementoSeleccionado = objetoTocado;
                    pausarVuelo = true;

                    // Desplegar Modal de Trivia
                    document.getElementById('trivia-titulo').innerText = discoActualSeleccionado.nombre;
                    document.getElementById('trivia-pregunta').innerText = data.pregunta;
                    document.getElementById('trivia-btn-1').innerText = data.opcionA;
                    document.getElementById('trivia-btn-2').innerText = data.opcionB;
                    document.getElementById('trivia-modal').style.display = 'block';
                }
            }
        });

        // Verificación de respuesta
        function verificarRespuesta(opcionElegida) {
            const data = elementoSeleccionado.userData;
            const esCorrecta = (opcionElegida === data.respuestaCorrecta);
            document.getElementById('trivia-modal').style.display = 'none';

            if (esCorrecta) {
                puntos += 100;
                document.getElementById('txt-puntos').innerText = puntos;
                alert("¡Pregunta conquistada!");

                // Eliminar pregunta del cosmos
                scene.remove(elementoSeleccionado);
                const index = objetosCosmos.indexOf(elementoSeleccionado);
                if (index > -1) objetosCosmos.splice(index, 1);

                // Si se acabaron las preguntas del disco, vuelve al menú de discos
                if (objetosCosmos.length === 0) {
                    alert("¡Completaste todo este disco con éxito!");
                    cargarDiscosGalaxia(multiverso.solista); // O la galaxia activa
                }
            } else {
                vidas--;
                actualizarVidasUI();
                alert("Respuesta incorrecta...");
                if (vidas <= 0) {
                    alert("Te quedaste sin vidas. ¡Reiniciando viaje!");
                    location.reload();
                }
            }

            elementoSeleccionado = null;
            pausarVuelo = false;
        }

        function actualizarVidasUI() {
            let corazones = "";
            for(let i = 0; i < vidas; i++) corazones += "❤️";
            document.getElementById('txt-vidas').innerText = corazones;
        }

        let targetX = 0, targetY = 0;
        window.addEventListener('mousemove', (e) => {
            if(!juegoIniciado) return;
            targetX = (e.clientX - window.innerWidth / 2) * 0.001;
            targetY = (e.clientY - window.innerHeight / 2) * 0.001;
        });
        window.addEventListener('touchmove', (e) => {
            if(!juegoIniciado) return;
            if(e.touches.length > 0) {
                targetX = (e.touches[0].clientX - window.innerWidth / 2) * 0.001;
                targetY = (e.touches[0].clientY - window.innerHeight / 2) * 0.001;
            }
        }, { passive: true });

        // Bucle de animación del Multiverso
        function animate() {
            requestAnimationFrame(animate);

            if (!pausarVuelo) {
                objetosCosmos.forEach(obj => {
                    obj.position.z += 0.4;
                    obj.rotation.y += 0.01;

                    if (obj.position.z > 20) {
                        obj.position.z = -200;
                        obj.position.x = (Math.random() - 0.5) * 40;
                        obj.position.y = (Math.random() - 0.5) * 25;
                    }
                });

                const starArr = stars.geometry.attributes.position.array;
                for(let i = 2; i < starArr.length; i += 3) {
                    starArr[i] += 0.8;
                    if(starArr[i] > 100) starArr[i] = -700;
                }
                stars.geometry.attributes.position.needsUpdate = true;
            }

            camera.rotation.y += (targetX - camera.rotation.y) * 0.05;
            camera.rotation.x += (targetY - camera.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
