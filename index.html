<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Túnel Cerati - Los Mundos</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05021a;
            font-family: sans-serif;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Pantalla de Intro / Bienvenida */
        #pantalla-intro {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 2, 26, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #pantalla-intro h1 {
            color: #fff;
            font-size: 24px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #ff00ff;
            margin-bottom: 10px;
        }
        #pantalla-intro p {
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 300px;
            line-height: 1.4;
        }
        .btn-inicio {
            background: linear-gradient(45deg, #ffcc00, #ff00ff);
            border: 2px solid #00ffff;
            color: #fff;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            cursor: pointer;
        }

        /* Capa de juego y UI (Puntaje y Vidas arriba) */
        #ui-capa {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            color: #fff;
            text-shadow: 0 0 10px #00ffff;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        .stats-box {
            font-size: 14px;
            font-weight: bold;
            background: rgba(5, 2, 26, 0.7);
            border: 1px solid #00ffff;
            padding: 5px 12px;
            border-radius: 10px;
        }

        /* Cuadro de Pregunta */
        #pregunta-wrapper {
            position: absolute;
            top: 70px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        #pregunta-container {
            background: rgba(5, 2, 26, 0.85);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 12px 20px;
            margin: 0 auto;
            max-width: 85%;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            pointer-events: auto;
        }
        #epoca-titulo { margin: 0 0 5px 0; font-size: 12px; color: #ff00ff; letter-spacing: 2px; }
        #pregunta-texto { font-size: 13px; color: #fff; font-weight: bold; }

        /* Botones de opciones abajo */
        #botones-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: none;
            justify-content: space-around;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 20;
        }
        .btn-opcion {
            background: rgba(148, 0, 211, 0.5);
            border: 2px solid #ff00ff;
            color: #fff;
            padding: 15px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            width: 45%;
            text-shadow: 0 0 5px #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
            cursor: pointer;
        }

        /* Reproductor de YouTube oculto para el audio de fondo */
        #youtube-audio {
            position: absolute;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- PANTALLA DE INTRODUCCIÓN -->
    <div id="pantalla-intro">
        <h1>BIENVENIDOS AL RITO</h1>
        <p>Atraviesa los portales de los mundos de Gustavo Cerati.</p>
        <button class="btn-opcion btn-inicio" onclick="comenzarJuego()">✨ ENTRAR AL VIAJE</button>
    </div>

    <!-- ESTADÍSTICAS -->
    <div id="ui-capa">
        <div class="stats-box">PUNTOS: <span id="txt-puntos">0</span></div>
        <div class="stats-box">VIDAS: <span id="txt-vidas">❤️❤️❤️</span></div>
    </div>

    <!-- PREGUNTA ACTIVA -->
    <div id="pregunta-wrapper">
        <div id="pregunta-container">
            <div id="epoca-titulo">FASE 1</div>
            <div id="pregunta-texto">Cargando...</div>
        </div>
    </div>

    <!-- BOTONES DE RESPUESTA -->
    <div id="botones-container">
        <button id="btn-1" class="btn-opcion" onclick="responder(1)">Opción A</button>
        <button id="btn-2" class="btn-opcion" onclick="responder(2)">Opción B</button>
    </div>
    
    <div id="canvas-container"></div>

    <!-- Reproductor de YouTube embebido -->
    <div id="youtube-audio">
        <iframe id="yt-player" width="100" height="100" src="" frameborder="0" allow="autoplay"></iframe>
    </div>

    <script>
        let juegoIniciado = false;
        let puntos = 0;
        let vidas = 3;
        let nivelActual = 0;

        // Base de datos completa con los Mundos / Eras de Cerati
        const trivias = [
            {
                epoca: "MUNDO: AMOR AMARILLO (1993)",
                colorTunel: 0xffcc00, // Amarillo brillante
                colorParticulas: 0xffffff,
                pregunta: "¿Con qué canción arranca su debut solista 'Amor Amarillo'?",
                opcionA: "Te Llevo para que Me Lleves",
                opcionB: "Pulsar",
                respuestaCorrecta: 1,
                trackId: "zhf8guZ41dY" // (Referencia de audio)
            },
            {
                epoca: "MUNDO: BOCANADA (1999)",
                colorTunel: 0x0066ff, // Azul humo
                colorParticulas: 0x00ffff,
                pregunta: '¿En qué año se lanzó el icónico álbum solista "Bocanada"?',
                opcionA: "1997",
                opcionB: "1999",
                respuestaCorrecta: 2,
                trackId: "l7LdGXXnIbs"
            },
            {
                epoca: "MUNDO: SIEMPRE ES HOY (2002)",
                colorTunel: 0xff0033, // Rojo eléctrico
                colorParticulas: 0xffcc00,
                pregunta: '¿A qué disco solista pertenece el tema "Artefacto"?',
                opcionA: "Siempre es Hoy",
                opcionB: "Fuerza Natural",
                respuestaCorrecta: 1,
                trackId: "zhf8guZ41dY"
            },
            {
                epoca: "MUNDO: ¡AHÍ VAMOS! (2006)",
                colorTunel: 0x222222, // Blanco y negro / gris oscuro
                colorParticulas: 0xffffff,
                pregunta: '¿Qué instrumento predomina fuertemente en el sonido rock de "¡Ahí Vamos"?',
                opcionA: "Sintetizadores analogicos",
                opcionB: "Guitarras eléctricas crudas",
                respuestaCorrecta: 2,
                trackId: "s3Ng7iLxUSs"
            },
            {
                epoca: "MUNDO: FUERZA NATURAL (2009)",
                colorTunel: 0x228b22, // Verde seco / naturaleza
                colorParticulas: 0xadff2f,
                pregunta: '¿Cuál es el concepto visual y sonoro del último álbum "Fuerza Natural"?',
                opcionA: "Viaje rutero y psicodelia folk",
                opcionB: "Electrónica de discoteca",
                respuestaCorrecta: 1,
                trackId: "zhf8guZ41dY"
            }
        ];

        function comenzarJuego() {
            juegoIniciado = true;
            document.getElementById('pantalla-intro').style.display = 'none';
            document.getElementById('ui-capa').style.display = 'flex';
            document.getElementById('pregunta-wrapper').style.display = 'block';
            document.getElementById('botones-container').style.display = 'flex';
            
            cargarMundoYPregunta(0);
        }

        function actualizarAudio(videoId) {
            const ytPlayer = document.getElementById('yt-player');
            ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}`;
        }

        function cargarMundoYPregunta(index) {
            const t = trivias[index];
            
            // Actualizar textos UI
            document.getElementById('epoca-titulo').innerText = t.epoca;
            document.getElementById('pregunta-texto').innerText = t.pregunta;
            document.getElementById('btn-1').innerText = t.opcionA;
            document.getElementById('btn-2').innerText = t.opcionB;

            // Cambiar los colores del mundo 3D en tiempo real según el disco
            tunnel.material.color.setHex(t.colorTunel);
            particles.material.color.setHex(t.colorParticulas);

            // Cambiar música de fondo
            actualizarAudio(t.trackId);
        }

        // Configuración 3D con Three.js
        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05021a, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        canvasContainer.appendChild(renderer.domElement);

        // Túnel Neón inicial
        const geometry = new THREE.CylinderGeometry(15, 15, 400, 24, 15, true);
        const material = new THREE.MeshBasicMaterial({
            color: 0xffcc00,
            wireframe: true,
            side: THREE.BackSide
        });
        const tunnel = new THREE.Mesh(geometry, material);
        tunnel.rotation.x = Math.PI / 2;
        scene.add(tunnel);

        // Partículas del universo
        const particleCount = 120;
        const particleGeometry = new THREE.BufferGeometry();
        const positions = [];
        for(let i = 0; i < particleCount; i++) {
            positions.push((Math.random() - 0.5) * 35, (Math.random() - 0.5) * 35, (Math.random() - 0.5) * 300);
        }
        particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        const particleMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.9});
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        camera.position.z = 0;

        // Lógica de respuesta y transición de mundos
        function responder(seleccionUsuario) {
            const t = trivias[nivelActual];
            const esCorrecta = (seleccionUsuario === t.respuestaCorrecta);

            if (esCorrecta) {
                puntos += 100;
                document.getElementById('txt-puntos').innerText = puntos;
                
                nivelActual++;
                if(nivelActual < trivias.length) {
                    alert("¡Portal superado! Entrando al siguiente mundo de Cerati...");
                    cargarMundoYPregunta(nivelActual);
                } else {
                    alert("¡Felicitaciones! Completaste todos los mundos y eras de Gustavo con " + puntos + " puntos.");
                    location.reload();
                }
            } else {
                vidas--;
                actualizarVidasUI();
                tunnel.material.color.setHex(0xff0000); // Destello rojo de error
                
                if(vidas <= 0) {
                    alert("Te quedaste sin vidas en el viaje. ¡Inténtalo de nuevo!");
                    location.reload();
                } else {
                    alert("¡Respuesta incorrecta! Pierdes una vida.");
                }

                // Restaura el color del mundo actual
                setTimeout(() => {
                    tunnel.material.color.setHex(t.colorTunel);
                }, 800);
            }
        }

        function actualizarVidasUI() {
            let corazones = "";
            for(let i = 0; i < vidas; i++) corazones += "❤️";
            document.getElementById('txt-vidas').innerText = corazones;
        }

        let targetX = 0;
        let targetY = 0;

        window.addEventListener('mousemove', (e) => {
            if(!juegoIniciado) return;
            targetX = (e.clientX - window.innerWidth / 2) * 0.002;
            targetY = (e.clientY - window.innerHeight / 2) * 0.002;
        });

        window.addEventListener('touchmove', (e) => {
            if(!juegoIngetSession = false) return;
            if(e.touches.length > 0) {
                targetX = (e.touches[0].clientX - window.innerWidth / 2) * 0.002;
                targetY = (e.touches[0].clientY - window.innerHeight / 2) * 0.002;
            }
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);

            tunnel.rotation.z += 0.005;
            particles.position.z += 1.5;
            if(particles.position.z > 150) particles.position.z = 0;

            camera.rotation.y += (targetX - camera.rotation.y) * 0.05;
            camera.rotation.x += (targetY - camera.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
