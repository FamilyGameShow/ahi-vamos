<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Túnel Cerati - Prototipo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05021a;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-capa {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 20px; letter-spacing: 3px; }
        p { margin: 5px 0; font-size: 12px; color: #00ffff; }
    </style>
    <!-- Cargamos Three.js desde un servidor CDN ultra compatible -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui-capa">
        <h1>AVANZANDO EN EL TIEMPO</h1>
        <p>Arrastra el dedo por la pantalla para mover la cámara</p>
    </div>
    
    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05021a, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Geometría del túnel
        const geometry = new THREE.CylinderGeometry(20, 20, 500, 32, 20, true);
        const material = new THREE.MeshBasicMaterial({
            color: 0x9400d3,
            wireframe: true,
            side: THREE.BackSide
        });
        const tunnel = new THREE.Mesh(geometry, material);
        tunnel.rotation.x = Math.PI / 2;
        scene.add(tunnel);

        // Partículas flotantes
        const pairs = 60;
        const lineGeometry = new THREE.BufferGeometry();
        const positions = [];
        for(let i=0; i<pairs; i++) {
            positions.push((Math.random()-0.5)*40, (Math.random()-0.5)*40, (Math.random()-0.5)*400);
        }
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        const lineMaterial = new THREE.PointsMaterial({color: 0x00ffff, size: 0.5});
        const stars = new THREE.Points(lineGeometry, lineMaterial);
        scene.add(stars);

        camera.position.z = 0;

        let targetX = 0;
        let targetY = 0;

        // Soporte para mouse en PC
        window.addEventListener('mousemove', (e) => {
            targetX = (e.clientX - window.innerWidth/2) * 0.003;
            targetY = (e.clientY - window.innerHeight/2) * 0.003;
        });

        // Soporte para pantalla táctil en celular (Corregido)
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                targetX = (e.touches[0].clientX - window.innerWidth/2) * 0.003;
                targetY = (e.touches[0].clientY - window.innerHeight/2) * 0.003;
            }
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);

            tunnel.rotation.y += 0.002;
            stars.position.z += 1.0; 
            if(stars.position.z > 200) stars.position.z = 0;

            // Movimiento suave de la cámara
            camera.rotation.y += (targetX - camera.rotation.y) * 0.05;
            camera.rotation.x += (targetY - camera.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
