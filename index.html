<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Colores Santos - El Multiverso de Cerati</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #02000a; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Capa de fondo con la escenografía dinámica */
        #escenografia-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            opacity: 0.35;
            z-index: 0;
            transition: background-image 0.8s ease-in-out;
        }

        /* Indicador visual de la punta de la nave */
        #nave-hud {
            position: absolute;
            bottom: 42%;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 50px solid rgba(0, 255, 255, 0.7);
            filter: drop-shadow(0 0 15px #00ffff);
            pointer-events: none; 
            z-index: 5;
            transition: transform 0.05s ease-out;
            display: none;
        }

        /* Pantalla de Intro / Bienvenida */
        #pantalla-intro { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(2, 0, 10, 0.94); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px; box-sizing: border-box; touch-action: auto; 
        }
        #pantalla-intro h1 { color: #fff; font-size: 26px; letter-spacing: 5px; text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff; margin-bottom: 10px; }
        #pantalla-intro p { color: #00ffff; font-size: 14px; margin-bottom: 30px; max-width: 320px; line-height: 1.5; }
        .btn-inicio { background: linear-gradient(45deg, #ff00ff, #00ffff); border: 2px solid #fff; color: #fff; padding: 15px 35px; border-radius: 30px; font-size: 16px; font-weight: bold; letter-spacing: 2px; box-shadow: 0 0 25px rgba(255, 0, 255, 0.7); cursor: pointer; pointer-events: auto; }

        /* Pantalla de Conteo Regresivo Musical */
        #pantalla-conteo {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 0, 10, 0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 90; text-align: center; display: none;
        }
        #txt-conteo-numero { font-size: 80px; color: #00ffff; text-shadow: 0 0 30px #00ffff; font-weight: bold; margin-bottom: 10px; }
        #txt-conteo-texto { font-size: 16px; color: #ff00ff; letter-spacing: 3px; text-shadow: 0 0 10px #ff00ff; }

        /* Capa de Estadísticas */
        #ui-capa { position: absolute; top: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; color: #fff; text-shadow: 0 0 10px #ff00ff; z-index: 10; pointer-events: none; display: none; }
        .stats-box { font-size: 13px; font-weight: bold; background: rgba(10, 5, 30, 0.8); border: 1px solid #ff00ff; padding: 6px 12px; border-radius: 12px; }
        #btn-volver { position: absolute; top: 60px; left: 20px; background: rgba(255, 0, 255, 0.3); border: 1px solid #ff00ff; color: #fff; padding: 8px 15px; border-radius: 10px; font-size: 12px; cursor: pointer; z-index: 15; display: none; pointer-events: auto; }

        /* Ventana flotante de Trivia */
        #trivia-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 5, 30, 0.95); border: 2px solid #00ffff; border-radius: 15px; padding: 20px; width: 85%; max-width: 350px; box-shadow: 0 0 30px rgba(0, 255, 255, 0.6); z-index: 50; text-align: center; display: none; touch-action: auto; }
        #trivia-titulo { color: #ff00ff; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px; font-weight: bold; }
        #trivia-pregunta { color: #fff; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .btn-opcion-cosmos { background: rgba(0, 255, 255, 0.2); border: 2px solid #00ffff; color: #fff; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: bold; width: 100%; margin-bottom: 10px; cursor: pointer; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3); pointer-events: auto; }

        #youtube-audio { position: absolute; top: -9999px; left: -9999px; visibility: hidden; }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="escenografia-fondo"></div>

    <!-- PANTALLA DE INTRODUCCIÓN -->
    <div id="pantalla-intro">
        <h1>COLORES SANTOS</h1>
        <p>El Multiverso Sonoro de Soda Stereo y Gustavo Cerati.</p>
        <button class="btn-opcion btn-inicio" id="btn-entrar">✨ PREPARAR NAVE</button>
    </div>

    <!-- PANTALLA DE CONTEO REGRESIVO -->
    <div id="pantalla-conteo">
        <div id="txt-conteo-numero">3</div>
        <div id="txt-conteo-texto">SINTONIZANDO FRECUENCIA ESPACIAL...</div>
    </div>

    <!-- UI DE JUEGO -->
    <div id="ui-capa">
        <div class="stats-box">PUNTOS: <span id="txt-puntos">0</span></div>
        <div class="stats-box" id="txt-estado">SELECCIONA UNA GALAXIA</div>
        <div class="stats-box">VIDAS: <span id="txt-vidas">❤️❤️❤️</span></div>
    </div>
    <button id="btn-volver">⬅️ VOLVER</button>

    <!-- VENTANA DE TRIVIA -->
    <div id="trivia-modal">
        <div id="trivia-titulo">OBJETO ICONO</div>
        <div id="trivia-pregunta">Pregunta aquí...</div>
        <button id="trivia-btn-1" class="btn-opcion-cosmos">Opción A</button>
        <button id="trivia-btn-2" class="btn-opcion-cosmos">Opción B</button>
    </div>

    <div id="nave-hud"></div>
    <div id="canvas-container"></div>

    <div id="youtube-audio">
        <iframe id="yt-player" width="100" height="100" src="" frameborder="0" allow="autoplay"></iframe>
    </div>

    <script>
        let juegoIniciado = false;
        let puntos = 0;
        let vidas = 3;
        let estadoActual = "MENU_PRINCIPAL";
        let objetosCosmos = [];
        let elementoSeleccionado = null;
        let pausarVuelo = false;
        let galaxiaActualKey = null;
        let discoActualSeleccionado = null;

        // Base de datos completa con todos los discos principales de Soda y Cerati Solista listos para configurar
        const multiverso = {
            audioIntro: "Wun6zDSpwkg",      // <-- 1. Audio que suena al entrar al botón inicial (Ej: Colores Santos)
            fondoPrincipal: "https://i.ibb.co/9Hy8h9fL/colores-santos.png", 
            
            soda: {
                nombre: "GALAXIA: SODA STEREO",
                trackId: "SV3oyTWdQao",      // <-- 2. Audio general al entrar al mundo Soda (Ej: Vuelta por el Universo)
                fondoGalaxia: "https://i.ibb.co/mF1WHsC8/mundosoda.png",
                color: 0x00ffff,
                discos: [
                    {
                        nombre: "DISCO: SODA STEREO (1984)",
                        color: 0x00ffcc,
                        trackId: "W0KTTiuw96A",
                        fondoDisco: "https://i.ibb.co/sT3L0VW/soda-stereo.png",
                        iconos: [
                            { nombre: "🎸 Primeros Acordes", tipoObjeto: "guitarra", pregunta: "¿Qué tema abre el primer disco oficial de Soda?", opcionA: "Jet Set", opcionB: "¿Por qué te fuiste?", respuestaCorrecta: 1 }
                        ]
                    },
                    {
                        nombre: "DISCO: NADA PERSONAL (1985)",
                        color: 0xff00ff,
                        trackId: "uOlCYVXOyFI", 
                        fondoDisco: "https://i.ibb.co/xq1TGpt8/nada-personal.png",
                        iconos: [
                            { nombre: "🎸 Guitarra Jackson", tipoObjeto: "guitarra", pregunta: "¿Qué modelo clásico utilizaba Gustavo en los 80s?", opcionA: "Jackson Soloist", opcionB: "Fender Stratocaster", respuestaCorrecta: 1 },
                            { nombre: "💇 Peinados 80s", tipoObjeto: "peinados", pregunta: "¿Qué estilo capilar marcó tendencia en la era Nada Personal?", opcionA: "Ondas setenteras", opcionB: "Jopo y jopo alto con spray", respuestaCorrecta: 2 },
                            { nombre: "🏟️ Estadio Obras", tipoObjeto: "lugar", pregunta: "¿En qué mítico estadio presentaron oficialmente este disco en 1985?", opcionA: "Estadio Obras Sanitarias", opcionB: "Luna Park", respuestaCorrecta: 1 }
                        ]
                    },
                    {
                        nombre: "DISCO: SIGNOS (1986)",
                        color: 0xff6600,
                        trackId: "C5vRGvsbz0w",
                        fondoDisco: "https://i.ibb.co/LXQbmwRR/signos.png",
                        iconos: [
                            { nombre: "🌵 Signos Tour", tipoObjeto: "gira", pregunta: "¿Qué país latinoamericano visitaron por primera vez desatando furor con este disco?", opcionA: "Chile", opcionB: "México", respuestaCorrecta: 1 }
                        ]
                    },
                    {
                        nombre: "DISCO: DOBLE VIDA (1988)",
                        color: 0xffff00,
                        trackId: "4l3oYRETotc",
                        fondoDisco: "https://i.ibb.co/cXZpRnKk/doble-vida.png",
                        iconos: [
                            { nombre: "🌃 L'Avenue", tipoObjeto: "video", pregunta: "¿En qué ciudad se filmó el videoclip de En la Ciudad de la Furia?", opcionA: "Nueva York", opcionB: "Buenos Aires", respuestaCorrecta: 1 }
                        ]
                    },
                    {
                        nombre: "DISCO: CANCIÓN ANIMAL (1990)",
                        color: 0x990000,
                        trackId: "ex1qICH12Eg",
                        fondoDisco: "https://i.ibb.co/rRbsVPJc/cancion-animal.png",
                        iconos: [
                            { nombre: "🐾 Arte de Tapa", tipoObjeto: "tapa", pregunta: "¿Qué animales aparecen en la portada original de Canción Animal?", opcionA: "Leones", opcionB: "Ciervos", respuestaCorrecta: 1 },
                            { nombre: "⚡ Hit de Apertura", tipoObjeto: "hit", pregunta: "¿Qué canción icónica abre el disco?", opcionA: "En el séptimo día", opcionB: "De música ligera", respuestaCorrecta: 1 }
                        ]
                    },
                    {
                        nombre: "DISCO: DYNAMO (1992)",
                        color: 0x0066ff,
                        trackId: "a5oUU6tGKFM",
                        fondoDisco: "https://i.ibb.co/S1G0p32/dynamo.png",
                        iconos: [
                            { nombre: "🔊 Sonido Sónico", tipoObjeto: "sonido", pregunta: "¿Qué corriente musical influenció fuertemente el sonido de Dynamo?", opcionA: "Shoegaze y Manchester", opcionB: "Heavy Metal clásico", respuestaCorrecta: 1 }
                        ]
                    },
                    {
                        nombre: "DISCO: SUEÑO STEREO (1995)",
                        color: 0xff00ff,
                        trackId: "IqBK2UjnUVA",
                        fondoDisco: "https://i.ibb.co/whCCS4r1/sue-o-stereo.png",
                        iconos: [
                            { nombre: "🪞 Púrpura", tipoObjeto: "cancion", pregunta: "¿Cuál fue el primer corte de difusión y gran éxito de Sueño Stereo?", opcionA: "Zoom", opcionB: "Ella usó mi cabeza como un revólver", respuestaCorrecta: 1 }
                        ]
                    }
                ]
            },
            solista: {
                nombre: "GALAXIA: GUSTAVO CERATI",
                trackId: "T1tDbvoHzo8",      // <-- 3. Audio general al entrar al mundo Solista
                fondoGalaxia: "https://images.unsplash.com/photo-1502134249126-9f3755a50d78?w=1200",
                color: 0xff00ff,
                discos: [
                    {
                        nombre: "DISCO: AMOR AMARILLO (1993)",
                        color: 0xffff33,
                        trackId: "ZOd-N9qGQK8",
                        fondoDisco: "https://i.ibb.co/KpPXvH5K/amor-amarillo.png",
                        iconos: [
                            { nombre: "🌼 Covers", tipoObjeto: "cover", pregunta: "¿Qué cover incluye este disco solista?", opcionA: "Bajan", opcionB: "Te para Tres", respuestaCorrecta: 1 }
                        ]
                    },
                    {
                        nombre: "DISCO: BOCANADA (1999)",
                        color: 0x0066ff,
                        trackId: "90SS2mXzPcA",
                        fondoDisco: "https://i.ibb.co/Gf9jPzVy/bocanada.png",
                        iconos: [
                            { nombre: "🌉 Puente", tipoObjeto: "puente", pregunta: "¿Qué instrumento principal destaca en el estribillo de Puente?", opcionA: "Guitarras acústicas gemelas", opcionB: "Sinte analógico", respuestaCorrecta: 1 },
                            { nombre: "🌀 Estudio Casa", tipoObjeto: "estudio", pregunta: "¿Cómo se llamaba el estudio personal donde grabó gran parte de Bocanada?", opcionA: "Del Cielito", opcionB: "Casa", respuestaCorrecta: 2 }
                        ]
                    },
                    {
                        nombre: "DISCO: AHÍ VAMOS (2006)",
                        color: 0xff0000,
                        trackId: "qfcwCrh4s7I",
                        fondoDisco: "https://i.ibb.co/prZnh9w4/ahi-vamos.png",
                        iconos: [
                            { nombre: "⚡ Crimen", tipoObjeto: "hit", pregunta: "¿Qué galardón internacional ganó el tema Crimen?", opcionA: "Premio Grammy Latino a Mejor Canción Rock", opcionB: "MTV Video Music Award", respuestaCorrecta: 1 }
                        ]
                    },
                    {
                        nombre: "DISCO: FUERZA NATURAL (2009)",
                        color: 0x00cc44,
                        trackId: "Z7ndVxqUb48",
                        fondoDisco: "https://i.ibb.co/V0yVhy8Y/fuerza-natural.png",
                        iconos: [
                            { nombre: "🐎 Arte y Viaje", tipoObjeto: "viaje", pregunta: "¿Con qué vehículo se identifica conceptualmente la estética de Fuerza Natural?", opcionA: "Una coupé modelo rutero / ruta psicodélica", opcionB: "Una nave espacial de los 70", respuestaCorrecta: 1 }
                        ]
                    }
                ]
            }
        };

        function cambiarFondo(urlImagen) {
            document.getElementById('escenografia-fondo').style.backgroundImage = `url('${urlImagen}')`;
        }

        // Evento de inicio con conteo regresivo para disfrutar la música
        document.getElementById('btn-entrar').addEventListener('click', iniciarConteoRegresivo);
        document.getElementById('btn-entrar').addEventListener('touchend', (e) => {
            e.preventDefault();
            iniciarConteoRegresivo();
        });

        function iniciarConteoRegresivo() {
            document.getElementById('pantalla-intro').style.display = 'none';
            document.getElementById('pantalla-conteo').style.display = 'flex';
            cambiarFondo(multiverso.fondoPrincipal);
            actualizarAudio(multiverso.audioIntro); // Suena el tema de bienvenida

            let cuenta = 3;
            const numEl = document.getElementById('txt-conteo-numero');
            numEl.innerText = cuenta;

            let timer = setInterval(() => {
                cuenta--;
                if (cuenta > 0) {
                    numEl.innerText = cuenta;
                } else {
                    clearInterval(timer);
                    document.getElementById('pantalla-conteo').style.display = 'none';
                    comenzarJuegoReal();
                }
            }, 1000); // 1 segundo por número para dejar escuchar la música
        }

        function comenzarJuegoReal() {
            juegoIniciado = true;
            document.getElementById('ui-capa').style.display = 'flex';
            document.getElementById('nave-hud').style.display = 'block';
            cargarMenuPrincipal();
        }

        document.getElementById('btn-volver').addEventListener('click', volverAlNivelAnterior);
        document.getElementById('btn-volver').addEventListener('touchend', (e) => {
            e.preventDefault();
            volverAlNivelAnterior();
        });

        document.getElementById('trivia-btn-1').addEventListener('click', () => verificarRespuesta(1));
        document.getElementById('trivia-btn-2').addEventListener('click', () => verificarRespuesta(2));

        function actualizarAudio(videoId) {
            const ytPlayer = document.getElementById('yt-player');
            ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}`;
        }

        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02000a, 0.015);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        canvasContainer.appendChild(renderer.domElement);

        const starGeometry = new THREE.BufferGeometry();
        const starPositions = [];
        for(let i = 0; i < 700; i++) {
            starPositions.push((Math.random() - 0.5) * 400, (Math.random() - 0.5) * 400, (Math.random() - 0.5) * 900);
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({color: 0xffffff, size: 0.9}));
        scene.add(stars);
        camera.position.z = 10;

        let raycaster = new THREE.Raycaster();
        let vectorPosicionMira = new THREE.Vector2(0, 0);

        function limpiarCosmos() {
            objetosCosmos.forEach(obj => scene.remove(obj));
            objetosCosmos = [];
        }

        function cargarMenuPrincipal() {
            limpiarCosmos();
            estadoActual = "MENU_PRINCIPAL";
            document.getElementById('btn-volver').style.display = 'none';
            document.getElementById('txt-estado').innerText = "SELECCIONA UNA GALAXIA";
            cambiarFondo(multiverso.fondoPrincipal);
            actualizarAudio(multiverso.audioIntro);

            const galaxias = [
                { key: 'soda', nombre: multiverso.soda.nombre, color: multiverso.soda.color, fondo: multiverso.soda.fondoGalaxia },
                { key: 'solista', nombre: multiverso.solista.nombre, color: multiverso.solista.color, fondo: multiverso.solista.fondoGalaxia }
            ];

            galaxias.forEach((g, index) => {
                const mesh = crearPortalMesh(g.nombre, g.color, index);
                mesh.userData = { tipo: 'galaxia', key: g.key, fondo: g.fondo, ...multiverso[g.key] };
                scene.add(mesh);
                objetosCosmos.push(mesh);
            });
        }

        function cargarDiscosGalaxia(galaxiaData, key) {
            limpiarCosmos();
            estadoActual = "MENU_DISCOS";
            galaxiaActualKey = key;
            document.getElementById('btn-volver').style.display = 'block';
            document.getElementById('txt-estado').innerText = galaxiaData.nombre;
            cambiarFondo(galaxiaData.fondoGalaxia);
            actualizarAudio(galaxiaData.trackId);

            galaxiaData.discos.forEach((disco, index) => {
                const mesh = crearPortalMesh(disco.nombre, disco.color, index);
                mesh.userData = { tipo: 'disco', ...disco };
                scene.add(mesh);
                objetosCosmos.push(mesh);
            });
        }

        function cargarIconosDisco(discoData) {
            limpiarCosmos();
            estadoActual = "JUEGO_ICONOS";
            discoActualSeleccionado = discoData;
            document.getElementById('txt-estado').innerText = discoData.nombre;
            if(discoData.fondoDisco) cambiarFondo(discoData.fondoDisco);
            actualizarAudio(discoData.trackId);

            discoData.iconos.forEach((icono, index) => {
                const mesh = crearPortalMesh(icono.nombre, 0x00ffcc, index);
                mesh.userData = { tipo: 'icono_trivia', ...icono };
                scene.add(mesh);
                objetosCosmos.push(mesh);
            });
        }

        function crearPortalMesh(nombre, colorHex, index) {
            const geometry = new THREE.TorusGeometry(3.2, 0.8, 16, 50);
            const material = new THREE.MeshBasicMaterial({ color: colorHex, wireframe: true });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set((Math.random() - 0.5) * 35, (Math.random() - 0.5) * 20, -50 - (index * 35));
            return mesh;
        }

        function volverAlNivelAnterior() {
            if (estadoActual === "JUEGO_ICONOS") {
                cargarDiscosGalaxia(multiverso[galaxiaActualKey], galaxiaActualKey);
            } else if (estadoActual === "MENU_DISCOS") {
                cargarMenuPrincipal();
            }
        }

        function comprobarColisionesNave() {
            if (!juegoIniciado || pausarVuelo) return;

            raycaster.setFromCamera(vectorPosicionMira, camera);
            const intersects = raycaster.intersectObjects(objetosCosmos);

            if (intersects.length > 0) {
                const objetoTocado = intersects[0].object;
                const data = objetoTocado.userData;

                if (data.tipo === 'galaxia') {
                    cargarDiscosGalaxia(data, data.key);
                } else if (data.tipo === 'disco') {
                    cargarIconosDisco(data);
                } else if (data.tipo === 'icono_trivia') {
                    elementoSeleccionado = objetoTocado;
                    pausarVuelo = true;
                    document.getElementById('trivia-titulo').innerText = discoActualSeleccionado.nombre;
                    document.getElementById('trivia-pregunta').innerText = data.pregunta;
                    document.getElementById('trivia-btn-1').innerText = data.opcionA;
                    document.getElementById('trivia-btn-2').innerText = data.opcionB;
                    document.getElementById('trivia-modal').style.display = 'block';
                }
            }
        }

        function verificarRespuesta(opcionElegida) {
            const data = elementoSeleccionado.userData;
            const esCorrecta = (opcionElegida === data.respuestaCorrecta);
            document.getElementById('trivia-modal').style.display = 'none';

            if (esCorrecta) {
                puntos += 100;
                document.getElementById('txt-puntos').innerText = puntos;
                alert("¡Icono conquistado con éxito!");
                scene.remove(elementoSeleccionado);
                const index = objetosCosmos.indexOf(elementoSeleccionado);
                if (index > -1) objetosCosmos.splice(index, 1);

                if (objetosCosmos.length === 0) {
                    alert("¡Has conquistado todos los misterios de este disco!");
                    cargarDiscosGalaxia(multiverso[galaxiaActualKey], galaxiaActualKey);
                }
            } else {
                vidas--;
                actualizarVidasUI();
                alert("Respuesta incorrecta... la nave recibe daño.");
                if (vidas <= 0) {
                    alert("Te quedaste sin escudo. ¡Reiniciando viaje cósmico!");
                    location.reload();
                }
            }
            elementoSeleccionado = null;
            pausarVuelo = false;
        }

        function actualizarVidasUI() {
            let corazones = "";
            for(let i = 0; i < vidas; i++) corazones += "❤️";
            document.getElementById('txt-vidas').innerText = corazones;
        }

        let targetX = 0, targetY = 0;
        const naveHud = document.getElementById('nave-hud');

        function actualizarMovimientoNave(clientX, clientY) {
            if(!juegoIniciado) return;
            
            targetX = (clientX - window.innerWidth / 2) * 0.001;
            targetY = (clientY - window.innerHeight / 2) * 0.001;
            
            const offsetX = clientX - window.innerWidth / 2;
            const offsetY = clientY - window.innerHeight / 2;
            
            const offsetHudY = offsetY - 80;
            naveHud.style.transform = `translate(calc(-50% + ${offsetX * 0.8}px), calc(-50% + ${offsetHudY}px)) rotate(${offsetX * 0.05}deg)`;

            const miraY = clientY - 80;
            vectorPosicionMira.x = (clientX / window.innerWidth) * 2 - 1;
            vectorPosicionMira.y = -(miraY / window.innerHeight) * 2 + 1;

            comprobarColisionesNave();
        }

        window.addEventListener('mousemove', (e) => {
            actualizarMovimientoNave(e.clientX, e.clientY);
        });

        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                actualizarMovimientoNave(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            if(e.touches.length > 0) {
                actualizarMovimientoNave(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);
            if (!pausarVuelo) {
                objetosCosmos.forEach(obj => {
                    obj.position.z += 0.5;
                    obj.rotation.z += 0.01;
                    if (obj.position.z > 20) {
                        obj.position.z = -180;
                        obj.position.x = (Math.random() - 0.5) * 35;
                        obj.position.y = (Math.random() - 0.5) * 20;
                    }
                });

                const starArr = stars.geometry.attributes.position.array;
                for(let i = 2; i < starArr.length; i += 3) {
                    starArr[i] += 1.0;
                    if(starArr[i] > 100) starArr[i] = -800;
                }
                stars.geometry.attributes.position.needsUpdate = true;
            }

            camera.rotation.y += (targetX - camera.rotation.y) * 0.05;
            camera.rotation.x += (targetY - camera.rotation.x) * 0.05;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
